version: '3.8'

services:
  simple-metricd:
    image: simple-metricd:latest
    container_name: simple-metricd
    ports:
      - "389:389/tcp"
      - "636:636/tcp"
    volumes:
      - ./config:/etc/simple-metricd:ro
      - ./data:/var/lib/simple-metricd
      - ./logs:/var/log/simple-metricd
    environment:
      - SIMPLE_METRICD_CONFIG=/etc/simple-metricd/simple-metricd.conf
      - SIMPLE_METRICD_LOG_LEVEL=info
      - SIMPLE_METRICD_BIND_ADDRESS=0.0.0.0
      - SIMPLE_METRICD_BIND_PORT=389
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "389"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - simple-metricd-network

networks:
  simple-metricd-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.22.0.0/16
