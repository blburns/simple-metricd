# simple-metricd high-security template
# Loopback (or management NIC) + ACL + optional TLS/auth.

listen_address = 127.0.0.1
listen_port = 19100
log_level = warning
log_file = /var/log/simple-metricd/simple-metricd.log
foreground = true
run_as_user = simple-metricd
rate_limit_per_minute = 120

# TLS (requires build with -DENABLE_SSL=ON)
# tls_cert_file = /etc/simple-metricd/certs/server.crt
# tls_key_file = /etc/simple-metricd/certs/server.key
# tls_ca_file = /etc/simple-metricd/certs/ca.crt

allow_ip = 127.0.0.1,::1
# deny_ip = 10.0.0.*
# auth_user = metrics
# auth_password = change-me
public_healthz = true

metric = simple_metricd_up gauge help=daemon process up
