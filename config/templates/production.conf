# simple-metricd production template
# Run under systemd/launchd with --foreground; package units set the service user.

listen_address = 0.0.0.0
listen_port = 19100
log_level = info
log_file = /var/log/simple-metricd/simple-metricd.log
foreground = true
run_as_user = simple-metricd

# Prefer locking down with allow_ip / TLS in high-security.conf for public binds.
rate_limit_per_minute = 300
public_healthz = true

metric = simple_metricd_up gauge help=daemon process up labels=job="simple-metricd"
metric = simple_metricd_info gauge value=1 help=build identity labels=version="1.0.0"

snapshot_file = /var/lib/simple-metricd/registry.snapshot
snapshot_interval = 60
