# simple-metricd development configuration
# Unprivileged listen port so a lab instance can bind without root.

listen_address = 127.0.0.1
listen_port = 19100
log_level = debug
foreground = true

# Parsed in v0.1.0; registry and HTTP exposition start in later milestones.
metric = simple_metricd_up gauge help=daemon process up
metric = simple_metricd_configured_metrics counter 0
