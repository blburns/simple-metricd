# simple-metricd development configuration
# Unprivileged listen port so a lab instance can bind without root.

listen_address = 127.0.0.1
listen_port = 19100
log_level = debug
foreground = true

# Static metrics exposed on GET /metrics (HELP/TYPE/labels included).
metric = simple_metricd_up gauge help=daemon process up labels=instance="local"
metric = simple_metricd_configured_metrics counter value=2 help=configured metric count

# Optional: pull scrape a local node_exporter or another daemon.
# scrape_target = 127.0.0.1:9100/metrics interval=15 timeout=5

# Optional: persist registry across restarts.
# snapshot_file = /tmp/simple-metricd.snapshot
# snapshot_interval = 60
