# simple-metricd development configuration
# Unprivileged listen port so a lab instance can bind without root.

listen_address = 127.0.0.1
listen_port = 19100
log_level = debug
foreground = true

# Registered into the in-memory registry and exposed on GET /metrics.
metric = simple_metricd_up gauge help=daemon process up labels=instance=\"local\"
metric = simple_metricd_configured_metrics counter value=0 help=configured metric count

# Pull scrape (milestone 6): periodically GET remote /metrics and merge.
# scrape_target = 127.0.0.1:9100/metrics interval=15 timeout=5

